databaseChangeLog:
  - changeSet:
      id: 2026-01-09-T22-33-add-image-columns-to-question
      author: Carlos Eduardo Torres Graciano
      changes:
        - addColumn:
            tableName: question
            columns:
              - column:
                  name: front_image_url
                  type: VARCHAR(300)
                  constraints:
                    nullable: true
              - column:
                  name: back_image_url
                  type: VARCHAR(300)
                  constraints:
                    nullable: true