databaseChangeLog:
  - changeSet:
      id: 2025-12-08-T10-12-seed-table-state-1
      author: carlos eduardo torres graciano
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: >
              SELECT COUNT(*) FROM state WHERE description = 'CREATED';
      changes:
        - insert:
            tableName: state
            columns:
              - column:
                  name: description
                  value: "CREATED"
              - column:
                  name: active
                  valueBoolean: "true"
